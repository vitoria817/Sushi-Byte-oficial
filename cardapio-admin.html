<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio administrativo do Sushi Byte">
    <title>Cardápio | Sushi Byte</title>


    <link rel="stylesheet" href="css/Dashboard.css">
<link rel="stylesheet" href="css/cardapio-admin.css">
<link rel="stylesheet" href="css/cardapio-admin-novo-produto.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-shell">

        <!-- MENU LATERAL ADMINISTRATIVO -->
        <aside class="sidebar">

            <a class="brand" href="Dashboard.html" aria-label="Sushi Byte início">
                <span class="brand-text">
                    <strong>SUSHI</strong> <b>BYTE</b>
                </span>
            </a>

            <nav class="navigation" aria-label="Menu principal">

                <a class="nav-link" href="Dashboard.html">
                    <span>▦</span> Dashboard
                </a>

                <a class="nav-link" href="pedidos-admin.html">
                    <span>▤</span> Pedidos
                </a>

                <a class="nav-link active" href="cardapio-admin.html">
                    <span>🍣</span> Cardápio
                </a>

                <a class="nav-link" href="estoque-admin.html">
                    <span>▣</span> Estoque
                </a>

                <a class="nav-link" href="relatorios-admin.html#funcionarios">
                    <span>♙</span> Funcionários
                </a>

                <a class="nav-link" href="relatorios-admin.html#cozinha">
                    <span>♨</span> Cozinha
                </a>

                <a class="nav-link" href="relatorios-admin.html#relatorios">
                    <span>▥</span> Relatórios
                </a>

            </nav>

            <div class="sidebar-bottom">
                <div class="user-avatar">G</div>

                <div class="user-details">
                    <strong id="nomeGerente">Gerente</strong>
                    <small>Gerente</small>
                </div>

                <button id="sairBtn" class="logout-button" type="button" title="Sair" aria-label="Sair">↪</button>
            </div>

        </aside>

        <!-- CONTEÚDO DO CARDÁPIO -->
        <main class="main-content cardapio-admin-conteudo">

            <header class="cardapio-topo">
                <div>
                    <h1>Cardápio</h1>
                    <p class="cardapio-subtitulo">
                        Consulte os produtos disponíveis no restaurante.
                    </p>
                </div>

                <button id="botaoNovoProduto" class="botao-novo-produto" type="button">
                    + Novo produto
                </button>
            </header>

            <section class="cardapio-area">

                <div class="PesquisaCardapio">
                    <span class="iconeDePesquisa">🔍</span>
                    <input type="text" id="BuscarItem" placeholder="Buscar produto..." aria-label="Buscar produto">
                </div>

                <div class="opcoesDoCardapio">
                    <button type="button">Combinados</button>
                    <button type="button">Sushi</button>
                    <button type="button">Temakis</button>
                    <button type="button">Bebidas</button>
                    <button type="button">Bandejas</button>
                </div>

                <div id="listaDeProdutos"></div>

            </section>

            <!-- MODAL NOVO PRODUTO -->
            <div id="fundoModalProduto">
                <div id="modalProduto">
                    <h3>Novo produto</h3>

                    <form id="formNovoProduto">
                        <label for="novoProdutoNome">Nome</label>
                        <input type="text" id="novoProdutoNome" placeholder="Ex.: Temaki Salmão" required>

                        <label for="novoProdutoDescricao">Descrição</label>
                        <textarea id="novoProdutoDescricao" placeholder="Descreva o produto"></textarea>

                        <div class="linha-campos">
                            <div>
                                <label for="novoProdutoPreco">Preço (R$)</label>
                                <input type="text" id="novoProdutoPreco" placeholder="46,00" required>
                            </div>
                            <div>
                                <label for="novoProdutoCategoria">Categoria</label>
                                <select id="novoProdutoCategoria" required>
                                    <option value="Combinados">Combinados</option>
                                    <option value="Sushi">Sushi</option>
                                    <option value="Temakis">Temakis</option>
                                    <option value="Bebidas">Bebidas</option>
                                    <option value="Bandejas">Bandejas</option>
                                </select>
                            </div>
                        </div>

                        <div class="linha-campos">
                            <div>
                                <label for="novoProdutoPecas">Peças (opcional)</label>
                                <input type="number" id="novoProdutoPecas" min="0" placeholder="8">
                            </div>
                            <div>
                                <label for="novoProdutoIcone">Ícone (opcional)</label>
                                <input type="text" id="novoProdutoIcone" maxlength="4" placeholder="🍣">
                            </div>
                        </div>

                        <p id="mensagemNovoProduto" role="status"></p>

                        <div class="acoes-modal-produto">
                            <button type="button" id="cancelarNovoProduto">Cancelar</button>
                            <button type="submit" id="salvarNovoProduto">Salvar produto</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- MODAL ORIGINAL -->
            <div id="fundoModalFinalizar">
                <div id="modalFinalizar">

                    <button id="fecharModalFinalizar" type="button">✕</button>

                    <h3>Finalizar Atendimento</h3>

                    <div id="cardPedidoModal">
                        <span id="numeroPedidoModal">#--</span>
                        <span id="statusPedidoModal">--</span>
                    </div>

                    <p id="totalPedidoModal">R$ 0.00</p>

                    <button id="continuarComprandoModal" type="button">
                        Continuar Comprando
                    </button>

                    <button id="sairTrocarMesaModal" type="button">
                        Sair / Trocar Mesa
                    </button>

                </div>
            </div>

            <footer class="footer">
                Sushi Byte <span>•</span> Painel administrativo
            </footer>

        </main>
    </div>

    <!-- MANTÉM OS SCRIPTS DO CARDÁPIO -->
    <script src="js/localStorage.js"></script>
    <script src="js/cardapioSelecao.js"></script>
    <script src="js/finalizarModal.js"></script>
    <script src="js/cardapio-admin-novo-produto.js"></script>

</body>

</html>
