<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cadastro Administrativo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/cadastroAdministrativo.css" rel="stylesheet">
</head>

<body>

    <div id="CardAdministrativo">

        <h1>
            <span id="sushiAdministrativo">SUSHI</span>
            <span id="byteAdministrativo">BYTE</span>
            <br>
        </h1>

        <h2>Painel Administrativo</h2>

        <div id="CadastroAdministrativo">

            <div id="TiposUsuario">
                <button id="Gerente" class = "selecionado">Gerente</button>
                <button id="Funcionario">Funcionário</button>
            </div>

            <p id="Email">Email</p>
            <input type="text" id="DigiteEmail" placeholder="seu@email.com">

            <p id="Senha">Senha</p>
            <input type="password" id="DigiteSenha" placeholder="••••••••">

            <button id="EntrarSistema">Entrar no Sistema</button>
        </div>
        <div id="esqueceuSenhaBotao">
            <button id="EsqueceuSenha">Esqueceu sua senha?</button>
        </div>
    </div>
    <script src="js/cadastroAdministrativo.js"></script>
</body>
</body>

</html>
